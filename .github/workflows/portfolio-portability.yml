# Restores the genuine check required by main; runs for every PR to avoid
# a permanently pending required check when only documentation changes.
name: Portfolio and control portability verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: portfolio-verification-${{ github.run_id }}
      MVP_FACTORY_CONTROL_DB_PORT: "55432"
      MVP_FACTORY_CONTROL_APP_PORT: "3107"
      NEXTAUTH_URL: http://localhost:3107
      MVP_FACTORY_CONTROL_DOCKER_HEALTH_TIMEOUT_SECONDS: "180"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify portfolio records and validator failure cases
        run: |
          node scripts/validate-portfolio.mjs
          node scripts/validate-portfolio.mjs --self-test
          node scripts/verify-local-font-assets.mjs
      - name: Prepare disposable CI configuration
        run: |
          chmod +x scripts/mvp-factory-control-docker-preflight.sh
          chmod +x scripts/mvp-factory-control-docker-bootstrap.sh
          chmod +x scripts/mvp-factory-control-docker-portability-gate.sh
          cat > apps/mvp-factory-control/.env <<'EOF'
          NEXTAUTH_URL=http://localhost:3107
          NEXTAUTH_SECRET=disposable-ci-verification-secret
          GOOGLE_CLIENT_ID=ci-not-a-real-client
          GOOGLE_CLIENT_SECRET=ci-not-a-real-secret
          DATABASE_URL=postgresql://mvp_factory_control:mvp_factory_control@localhost:55432/mvp_factory_control?schema=public
          MVP_FACTORY_CONTROL_GITHUB_TOKEN=ci-no-access-token
          MVP_FACTORY_CONTROL_GITHUB_PROJECT_OWNER=moldovancsaba
          MVP_FACTORY_CONTROL_GITHUB_PROJECT_NUMBER=1
          MVP_FACTORY_CONTROL_TASK_REPO_OWNER=moldovancsaba
          MVP_FACTORY_CONTROL_TASK_REPO_NAME=mvp-factory-control
          EOF
      - name: Run existing portability gate in disposable GitHub runner
        run: ./scripts/mvp-factory-control-docker-portability-gate.sh
