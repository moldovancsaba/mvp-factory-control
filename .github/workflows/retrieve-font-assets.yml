name: Retrieve verified public font assets
on:
  push:
    branches: [fix/local-font-build]
permissions:
  contents: read
jobs:
  font-0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve and verify licensed upstream asset
        run: |
          curl --fail --silent --show-error --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsans/IBMPlexSans%5Bwdth%2Cwght%5D.ttf' --output font.ttf
          test "$(git hash-object font.ttf)" = "30f837e8b02e8ecddce6cbebc425b1f422392515"
          echo FONT_BASE64_BEGIN
          base64 -w 76 font.ttf
          echo FONT_BASE64_END
  font-1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve and verify licensed upstream asset
        run: |
          curl --fail --silent --show-error --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexmono/IBMPlexMono-Regular.ttf' --output font.ttf
          test "$(git hash-object font.ttf)" = "0c9770d5183ba60dc4350d3e011b782a320761ae"
          echo FONT_BASE64_BEGIN
          base64 -w 76 font.ttf
          echo FONT_BASE64_END
  font-2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
