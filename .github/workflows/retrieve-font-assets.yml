        run: |
          curl --fail --silent --show-error --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexmono/IBMPlexMono-Medium.ttf' --output font.ttf
          test "$(git hash-object font.ttf)" = "33c546f68b6007a45a3f10e845523abb2db25399"
          echo FONT_BASE64_BEGIN
          base64 -w 76 font.ttf
          echo FONT_BASE64_END
  font-3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve and verify licensed upstream asset
        run: |
          curl --fail --silent --show-error --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexmono/IBMPlexMono-SemiBold.ttf' --output font.ttf
          test "$(git hash-object font.ttf)" = "8f8998a139d8f61d3b96bdd3b512fca501a1f6b9"
