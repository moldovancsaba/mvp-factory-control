name: Trinity documentation preflight
on:
  push:
    branches: [docs/blockmass-welcome-evidence]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: sovereignsquad/trinity
          ref: 6175c399564e9c54b733cd6ea24e1955a4145e63
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --dev --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest
      - name: Check entry-point link destinations
        run: |
          python - <<'PY'
          import pathlib, re
          root=pathlib.Path.cwd()
          count=0
          for name in ['README.md','docs/STATUS.md','docs/HANDOVER.md']:
              source=root/name
              text=source.read_text()
              for target in re.findall(r'\]\(([^)]+)\)',text):
                  if target.startswith(('https://','http://','#','mailto:')):
                      continue
                  assert not target.startswith('/Users/Shared/Projects/trinity/'), target
                  destination=(source.parent/target.split('#')[0]).resolve()
                  assert destination.is_relative_to(root), target
                  assert destination.exists(), f'{name}: {target}'
                  count+=1
          print(f'PASS: {count} local entry-point links resolve')
          PY
  native-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: sovereignsquad/trinity
          ref: 6175c399564e9c54b733cd6ea24e1955a4145e63
          persist-credentials: false
      - run: swift build
        working-directory: apps/macos
