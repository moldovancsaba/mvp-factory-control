name: Static site welcome preflight
on:
  push:
    branches: [docs/seyu-welcome-evidence]
permissions:
  contents: read
jobs:
  clean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: moldovancsaba/seyusolutions
          ref: 4847210218ac4da18551388effa7a3a14227f42b
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare bounded build-tool lockfile candidate
        run: |
          node -e "const fs=require('fs');fs.copyFileSync('package.json','/tmp/seyu-manifest-before.json');fs.copyFileSync('package-lock.json','/tmp/seyu-lock-before.json')"
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          assert.equal(readFileSync('package.json','utf8'),readFileSync('/tmp/seyu-manifest-before.json','utf8'),'manifest must remain unchanged');
          JS
      - run: npm ci
      - name: Verify six-page clean build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/seyu-build.log
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const log = readFileSync('/tmp/seyu-build.log', 'utf8').replace(/\x1b\[[0-9;]*m/g, '');
          assert.ok(!/\b(?:warning|warn|error)\b|\(!\)/i.test(log), 'build must have no warnings/errors');
          for (const p of ['index.html','marketing-agency.html','founder.html','gtc.html','privacy.html','cookie-policy.html']) assert.ok(existsSync('dist/' + p), p);
          console.log('PASS: six configured HTML outputs; zero build warnings/errors');
          JS
      - name: Verify local project-path preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4175 > /tmp/seyu-preview.log 2>&1 &
          SEYU_PREVIEW_PID=$!
          trap 'kill "$SEYU_PREVIEW_PID" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          for (let i=0;i<50;i++) {
            try { if ((await fetch('http://127.0.0.1:4175/seyusolutions/')).ok) break; } catch {}
            await new Promise(resolve=>setTimeout(resolve,100));
          }
          for (const path of ['', 'marketing-agency.html','founder.html','gtc.html','privacy.html','cookie-policy.html']) {
            const r = await fetch('http://127.0.0.1:4175/seyusolutions/' + path);
            assert.equal(r.status,200,path);
            assert.ok((await r.text()).includes('<title>'),path);
          }
          console.log('PASS: all six pages served under configured project base');
          JS
      - name: Read dependency advisory details
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          let output;
          try { output = execFileSync('npm', ['audit','--json'], {encoding:'utf8'}); }
          catch (error) { output = error.stdout; }
          const report = JSON.parse(output);
          if (report.error) throw new Error(JSON.stringify(report.error));
          console.log(JSON.stringify({counts:report.metadata?.vulnerabilities, findings:Object.values(report.vulnerabilities ?? {}).map(v=>({name:v.name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(a=>typeof a==='string'?a:{title:a.title,url:a.url,range:a.range})}))}));
          JS
      - name: Export reviewed lockfile candidate
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const lock = readFileSync('package-lock.json');
          const old = JSON.parse(readFileSync('/tmp/seyu-lock-before.json','utf8')).packages;
          const next = JSON.parse(lock).packages;
          console.log('LOCK_CHANGES=' + JSON.stringify(Object.entries(next).filter(([p,v])=>p && old[p]?.version!==v.version).map(([p,v])=>({path:p,from:old[p]?.version??'(new)',to:v.version}))));
          console.log('LOCK_BLOB_SHA=' + createHash('sha1').update(Buffer.from('blob ' + lock.length)).update(Buffer.from([0])).update(lock).digest('hex'));
          console.log('LOCK_BASE64_BEGIN');
          console.log(lock.toString('base64'));
          console.log('LOCK_BASE64_END');
          JS
  live-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Read configured public destination identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url = 'https://moldovancsaba.github.io/seyusolutions/';
          const r = await fetch(url, {signal:AbortSignal.timeout(20000)});
          assert.equal(r.status,200);
          const html = await r.text();
          const title = html.match(/<title>([^<]+)<\/title>/i)?.[1];
          const canonical = html.match(/<link[^>]*rel=["']canonical["'][^>]*href=["']([^"']+)/i)?.[1];
          assert.equal(title, 'Seyu — We Connect Fans With Their Stars');
          assert.equal(canonical, url);
          console.log(JSON.stringify({status:r.status,title,canonical,observedAt:new Date().toISOString()}));
          JS
